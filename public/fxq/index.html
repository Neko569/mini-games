<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>飞行棋 · FXQ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✈️</text></svg>">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<!-- 大厅 -->
<div id="lobby" class="page">
  <div class="lobby-card">
    <h1>✈️ 飞行棋</h1>
    <p class="sub">匿名房间 · 好友对战 · 无需注册</p>
    <div class="profile-row">
      <img id="lobby-avatar" class="avatar" alt="">
      <input id="lobby-name" maxlength="16" placeholder="你的昵称">
    </div>
    <button id="btn-create" class="btn primary big">创建房间</button>
    <div class="divider">或</div>
    <div class="join-row">
      <input id="lobby-code" maxlength="4" placeholder="房间号" autocapitalize="off">
      <button id="btn-join" class="btn">加入</button>
    </div>
    <p class="hint" id="lobby-msg"></p>
  </div>
</div>

<!-- 对局 -->
<div id="game" class="page hidden">
  <header>
    <span class="brand">✈️ 飞行棋</span>
    <span id="room-code" class="code" title="点击复制邀请链接"></span>
    <button id="btn-start" class="btn primary">开始游戏</button>
    <button id="btn-leave" class="btn ghost">离开</button>
  </header>
  <main>
    <div class="board-wrap">
      <canvas id="board" width="640" height="640"></canvas>
      <div id="turn-banner" class="turn-banner hidden"></div>
    </div>
    <aside class="panel">
      <div id="players"></div>
      <div class="dice-row">
        <div id="dice" class="dice">⚀</div>
        <button id="btn-roll" class="btn primary big" disabled>掷骰子</button>
      </div>
      <div id="action-hint" class="hint"></div>
      <div id="chat">
        <div id="chat-log"></div>
        <div class="chat-input-row">
          <input id="chat-input" maxlength="200" placeholder="聊天…">
          <button id="btn-chat" class="btn small">发</button>
        </div>
      </div>
    </aside>
  </main>
</div>

<div id="toast" class="toast hidden"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
