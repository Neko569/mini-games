<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>黑白棋 · 游戏厅</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%231B5E20'/%3E%3Ccircle cx='38' cy='38' r='17' fill='%23111'/%3E%3Ccircle cx='63' cy='63' r='17' fill='white' stroke='%23ccc' stroke-width='2'/%3E%3C/svg%3E">
<style>
  :root { --bg:#0f1420; --panel:#1a2233; --text:#e8ecf4; --muted:#8b97ad; --accent:#43a047; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC",sans-serif; min-height:100vh; }
  .hidden { display:none !important; }
  #lobby { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .lobby-card { background:var(--panel); border-radius:16px; padding:36px 32px; width:min(92vw,380px); text-align:center; }
  .lobby-card h1 { font-size:28px; margin-bottom:16px; }
  .lobby-card input { width:100%; padding:10px; border-radius:8px; border:1px solid #2a3a52; background:#0f1420; color:var(--text); margin:6px 0; font-size:15px; }
  .row { display:flex; gap:10px; margin-top:10px; }
  .btn { background:var(--accent); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-size:14px; cursor:pointer; }
  .btn.ghost { background:transparent; border:1px solid #2a3a52; color:var(--muted); }
  header { display:flex; align-items:center; gap:14px; padding:12px 16px; background:var(--panel); }
  header .code { font-family:monospace; letter-spacing:3px; color:#ffd54a; cursor:pointer; font-weight:700; }
  header .spacer { flex:1; }
  main { max-width:560px; margin:0 auto; padding:14px; }
  #board { display:grid; grid-template-columns:repeat(8,1fr); width:min(92vw,440px); aspect-ratio:1; margin:10px auto; background:#1B5E20; border:3px solid #2E7D32; border-radius:8px; overflow:hidden; }
  .cell { position:relative; border:.5px solid #2E7D32; display:flex; align-items:center; justify-content:center; }
  .cell.legal { cursor:pointer; }
  .cell.legal::after { content:''; width:22%; height:22%; border-radius:50%; background:rgba(255,255,255,.28); }
  .cell.last::before { content:''; position:absolute; inset:8%; border:2px solid #ffd54a; border-radius:50%; z-index:2; pointer-events:none; }
  .cell svg { width:76%; height:76%; }
  .scorebar { display:flex; align-items:center; justify-content:center; gap:18px; padding:8px; font-size:16px; font-weight:700; }
  .scorebar .sc { display:flex; align-items:center; gap:6px; }
  .scorebar svg { width:20px; height:20px; }
  .scorebar .lead { color:#ffd54a; font-size:12px; font-weight:400; margin-left:2px; }
  .banner { text-align:center; padding:8px; font-size:15px; font-weight:600; }
  .banner.me { color:#ffd54a; }
  .toolbar { display:flex; gap:8px; margin:8px 0; justify-content:center; }
  .winbox { text-align:center; font-size:22px; font-weight:800; padding:14px; color:#ffd54a; }
  #chat-log { height:110px; overflow-y:auto; background:var(--panel); border-radius:10px; padding:8px; font-size:13px; line-height:1.5; margin-top:10px; }
  .chatwrap { display:flex; gap:8px; margin-top:8px; }
  .chatwrap input { flex:1; padding:8px; border-radius:8px; border:1px solid #2a3a52; background:#0f1420; color:var(--text); }
  .toast { position:fixed; top:14%; left:50%; transform:translateX(-50%); background:#1a2740; padding:10px 20px; border-radius:10px; z-index:99; }
  .toast.err { background:#7f1d1d; }
</style>
</head>
<body>
<div id="lobby" class="hidden">
  <div class="lobby-card">
    <h1>⚪ 黑白棋</h1>
    <input id="lobby-name" maxlength="16" placeholder="昵称">
    <input id="join-code" maxlength="4" placeholder="房间号（加入用）" autocapitalize="off">
    <div class="row">
      <button class="btn" id="btn-create">创建房间</button>
      <button class="btn ghost" id="btn-join">加入</button>
    </div>
    <div id="lobby-msg"></div>
  </div>
</div>
<div id="game" class="hidden">
  <header>
    <span>⚪ 黑白棋</span>
    <span class="code" id="room-code" title="点击复制邀请链接"></span>
    <span class="spacer"></span>
    <button id="btn-start" class="btn hidden">开始对局</button>
    <button id="btn-leave" class="btn ghost">离开</button>
  </header>
  <main>
    <div class="scorebar" id="scorebar"></div>
    <div class="banner" id="banner"></div>
    <div id="board"></div>
    <div class="toolbar">
      <button class="btn ghost" id="btn-pass" disabled>⏭ 跳过回合</button>
    </div>
    <div class="winbox hidden" id="winbox"></div>
    <div id="chat-log"></div>
    <div class="chatwrap">
      <input id="chat-input" maxlength="200" placeholder="聊天…">
      <button class="btn" id="btn-chat">发</button>
    </div>
  </main>
</div>
<div id="toast" class="toast hidden"></div>
<script type="module" src="./reversi.js"></script>
</body>
</html>
