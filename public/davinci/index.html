<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>达芬奇密码 · 游戏厅</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
<style>
  :root { --bg:#0f1420; --panel:#1a2233; --text:#e8ecf4; --muted:#8b97ad; --accent:#4f8cff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC",sans-serif; min-height:100vh; }
  .hidden { display:none !important; }
  #lobby { display:flex; align-items:center; justify-content:center; min-height:100vh; }
  .lobby-card { background:var(--panel); border-radius:16px; padding:36px 32px; width:min(92vw,380px); text-align:center; }
  .lobby-card h1 { font-size:28px; margin-bottom:16px; }
  .lobby-card input { width:100%; padding:10px; border-radius:8px; border:1px solid #2a3a52; background:#0f1420; color:var(--text); margin:6px 0; font-size:15px; }
  .row { display:flex; gap:10px; margin-top:10px; }
  .btn { background:var(--accent); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-size:14px; cursor:pointer; }
  .btn.ghost { background:transparent; border:1px solid #2a3a52; color:var(--muted); }
  .btn:disabled { opacity:.4; cursor:not-allowed; }
  header { display:flex; align-items:center; gap:14px; padding:12px 16px; background:var(--panel); }
  header .code { font-family:monospace; letter-spacing:3px; color:#ffd54a; cursor:pointer; font-weight:700; }
  header .spacer { flex:1; }
  main { max-width:860px; margin:0 auto; padding:14px; }
  .opp { background:var(--panel); border-radius:10px; padding:8px 10px; margin-bottom:8px; }
  .opp .nm { font-size:14px; margin-bottom:6px; display:flex; gap:8px; align-items:center; }
  .opp.active { outline:2px solid var(--accent); }
  .opp.dead { opacity:.4; }
  .cards { display:flex; gap:6px; flex-wrap:wrap; }
  .card { min-width:40px; height:56px; border-radius:7px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:18px; border:2px solid #555; padding:0 6px; }
  .card.down { background:#2a3a52; color:transparent; cursor:pointer; position:relative; }
  .card.down::after { content:'?'; color:#8b97ad; position:absolute; }
  .card.down.guessable { outline:2px solid #ffd54a; cursor:pointer; }
  .card.down.mine { color:#fff; cursor:pointer; }
  .card.revealed { opacity:.95; }
  .card.sel { outline:3px solid #ffd54a; }
  .card.cB { background:#1a1a1a; } .card.cW { background:#eceff1; color:#111; } .card.cJ { background:linear-gradient(135deg,#e53935,#1e88e5); }
  .myhand { margin:12px 0; }
  .myhand .label, .opps .label { color:var(--muted); font-size:12px; margin-bottom:6px; }
  .toolbar { display:flex; gap:10px; margin:10px 0; align-items:center; flex-wrap:wrap; }
  .banner { text-align:center; padding:8px; font-size:15px; font-weight:600; }
  .banner.me { color:#ffd54a; }
  .guessui { background:var(--panel); border-radius:10px; padding:12px; margin:10px 0; }
  .gtitle { font-size:13px; color:var(--muted); margin-bottom:8px; }
  .gn { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .gnb { width:40px; height:40px; border-radius:8px; border:2px solid #2a3a52; background:#0f1420; color:var(--text); font-weight:700; cursor:pointer; }
  .gnb.sel { border-color:#ffd54a; color:#ffd54a; }
  .winbox { text-align:center; font-size:22px; font-weight:800; padding:14px; color:#ffd54a; }
  #chat-log { height:120px; overflow-y:auto; background:var(--panel); border-radius:10px; padding:8px; font-size:13px; line-height:1.5; margin-top:10px; }
  .chatwrap { display:flex; gap:8px; margin-top:8px; }
  .chatwrap input { flex:1; padding:8px; border-radius:8px; border:1px solid #2a3a52; background:#0f1420; color:var(--text); }
  .toast { position:fixed; top:14%; left:50%; transform:translateX(-50%); background:#1a2740; padding:10px 20px; border-radius:10px; z-index:99; }
  .toast.err { background:#7f1d1d; }
</style>
</head>
<body>
<div id="lobby" class="hidden">
  <div class="lobby-card">
    <h1>🔐 达芬奇密码</h1>
    <input id="lobby-name" maxlength="16" placeholder="昵称">
    <input id="join-code" maxlength="4" placeholder="房间号（加入用）" autocapitalize="off">
    <div class="row">
      <button class="btn" id="btn-create">创建房间</button>
      <button class="btn ghost" id="btn-join">加入</button>
    </div>
    <div id="lobby-msg"></div>
  </div>
</div>
<div id="game" class="hidden">
  <header>
    <span>🔐 达芬奇密码</span>
    <span class="code" id="room-code" title="点击复制邀请链接"></span>
    <span class="spacer"></span>
    <button id="btn-start" class="btn hidden">开始游戏</button>
    <button id="btn-leave" class="btn ghost">离开</button>
  </header>
  <main>
    <div class="banner" id="banner"></div>
    <div class="toolbar">
      <button class="btn" id="btn-draw" disabled>摸一张</button>
      <span style="color:var(--muted);font-size:13px" id="deckinfo"></span>
    </div>
    <div class="opps" id="opps"></div>
    <div class="myhand">
      <div class="label">我的手牌（自己可见 · 点击暗牌可弃）</div>
      <div class="cards" id="mycards"></div>
    </div>
    <div class="guessui hidden" id="guessui">
      <div class="gtitle">猜 <b id="g-target"></b> 的暗牌：选颜色和点数</div>
      <div class="gn" id="g-colors">
        <button class="gnb" data-c="B">黑</button>
        <button class="gnb" data-c="W">白</button>
        <button class="gnb" data-c="J">J</button>
      </div>
      <div class="gn" id="g-ranks"></div>
      <div class="row">
        <button class="btn" id="btn-guess">开猜！</button>
        <button class="btn ghost" id="btn-cancel-guess">取消</button>
      </div>
    </div>
    <div class="winbox hidden" id="winbox"></div>
    <div id="chat-log"></div>
    <div class="chatwrap">
      <input id="chat-input" maxlength="200" placeholder="聊天…">
      <button class="btn" id="btn-chat">发</button>
    </div>
  </main>
</div>
<div id="toast" class="toast hidden"></div>
<script type="module" src="./davinci.js"></script>
</body>
</html>
