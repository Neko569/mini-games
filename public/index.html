<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>游戏厅 · 与晚风棋社</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='2.5' y='2.5' width='19' height='19' rx='4.5' fill='%23fff' stroke='%23c9d2e0'/%3E%3Ccircle cx='7.5' cy='7.5' r='2' fill='%23243040'/%3E%3Ccircle cx='16.5' cy='7.5' r='2' fill='%23243040'/%3E%3Ccircle cx='12' cy='12' r='2' fill='%23243040'/%3E%3Ccircle cx='7.5' cy='16.5' r='2' fill='%23243040'/%3E%3Ccircle cx='16.5' cy='16.5' r='2' fill='%23243040'/%3E%3C/svg%3E">
<style>
  :root { --bg:#0f1420; --panel:#1a2233; --text:#e8ecf4; --muted:#8b97ad; --accent:#4f8cff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; min-height:100vh; }
  .wrap { max-width:760px; margin:0 auto; padding:32px 20px; }
  h1 { font-size:26px; margin-bottom:4px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:24px; }
  .profile { display:flex; align-items:center; gap:10px; margin-bottom:20px; }
  .profile img { width:44px; height:44px; border-radius:10px; object-fit:cover; background:#0d1320; }
  input { background:#0d1320; border:1px solid #2a3854; color:var(--text); border-radius:10px; padding:10px 14px; font-size:14px; outline:none; }
  input:focus { border-color:var(--accent); }
  #lobby-name { width:200px; }
  #join-code { width:110px; text-transform:lowercase; font-family:monospace; letter-spacing:2px; }
  .btn { border:none; border-radius:10px; padding:10px 18px; font-size:14px; font-weight:600; cursor:pointer; background:var(--accent); color:#fff; }
  .btn.ghost { background:#2a3854; }
  .btn:disabled { opacity:.5; cursor:not-allowed; }

  /* Tabs */
  .tabs { display:flex; gap:8px; margin-bottom:20px; border-bottom:1px solid #24304a; padding-bottom:0; }
  .tab { border:none; background:none; color:var(--muted); font-size:15px; font-weight:600; padding:10px 16px; cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.active { color:var(--text); border-bottom-color:var(--accent); }

  /* 大厅 */
  .quickbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .quickbar .sep { color:var(--muted); font-size:13px; }
  .hint { color:var(--muted); font-size:12px; margin-top:10px; min-height:16px; }
  .rooms { display:flex; flex-direction:column; gap:10px; }
  .room { display:flex; align-items:center; gap:12px; background:var(--panel); border:1px solid #24304a; border-radius:12px; padding:12px 16px; }
  .room .gicon { font-size:24px; }
  .room .meta { flex:1; min-width:0; }
  .room .meta b { font-size:14px; }
  .room .meta .code { font-family:monospace; color:var(--accent); letter-spacing:1px; }
  .room .meta .host { color:var(--muted); font-size:12px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge { font-size:11px; border-radius:6px; padding:3px 8px; font-weight:600; }
  .badge.wait { background:#16324f; color:#7db4ff; }
  .badge.play { background:#3a2c12; color:#f0b429; }
  .cnt { font-size:13px; color:var(--muted); font-variant-numeric:tabular-nums; }
  .empty { text-align:center; color:var(--muted); font-size:14px; padding:36px 0; border:1px dashed #2a3854; border-radius:12px; }
  .empty .btn { margin-top:12px; }

  /* 游戏列表 */
  .games { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; margin-bottom:28px; }
  .card { background:var(--panel); border-radius:14px; padding:20px; border:1px solid #24304a; transition:.2s; }
  .card:hover { border-color:var(--accent); }
  .card .icon svg { width:44px; height:44px; display:block; }
  .card h2 { font-size:18px; margin:8px 0 4px; }
  .card p { color:var(--muted); font-size:13px; margin-bottom:14px; line-height:1.6; }
  .card .row { display:flex; gap:10px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎲 游戏厅</h1>
  <p class="sub">匿名开局 · 房间号邀请 · 无需注册</p>

  <div class="profile">
    <img id="avatar" alt="">
    <input id="lobby-name" maxlength="16" placeholder="你的昵称">
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="lobby">🔥 游戏大厅</button>
    <button class="tab" data-tab="games">🎮 游戏列表</button>
  </div>

  <!-- Tab 1：游戏大厅（默认） -->
  <div id="tab-lobby">
    <div class="quickbar">
      <button class="btn" id="btn-quick">⚡ 快速加入</button>
      <span class="sep">或凭房间号：</span>
      <input id="join-code" maxlength="4" placeholder="房间号" autocapitalize="off">
      <button class="btn ghost" id="btn-join">加入</button>
    </div>
    <div class="hint" id="msg"></div>
    <div class="rooms" id="rooms"></div>
  </div>

  <!-- Tab 2：游戏列表 -->
  <div id="tab-games" hidden>
    <div class="games" id="games"></div>
    <div class="stats" id="stats" style="margin:24px 0"></div>
  </div>
</div>
<script type="module">
import { EMBLEM, svgDie, avatarURI } from '/assets/icons.js';

// HTML 转义（所有来自服务器的字符串渲染前必须过这里）
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const qs = new URLSearchParams(location.search);
const profile = JSON.parse(localStorage.getItem('fxq_profile') || '{}');
if (qs.get('name')) profile.name = qs.get('name');
if (qs.get('avatar')) profile.avatar = qs.get('avatar');
if (!profile.gid) profile.gid = crypto.randomUUID();
profile.name = (profile.name || '').slice(0, 16) || '玩家';
localStorage.setItem('fxq_profile', JSON.stringify(profile));

const GAMES = [
  { id: 'fxq', icon: '✈️', name: '飞行棋', desc: '4 人经典对战 · 掷骰起飞 · 撞机回跳', path: '/fxq' },
  { id: 'gobang', icon: '⚫', name: '五子棋', desc: '2 人对弈 · 15 路棋盘 · 五连即胜', path: '/gobang' },
  { id: 'uno', icon: '🃏', name: 'UNO', desc: '经典 108 张 · 2-6 人 · 罚牌/万能牌全支持', path: '/uno' },
  { id: 'planes', icon: '🛩️', name: '炸飞机', desc: '10×10 布阵对轰 · 炸中机头击落 · 3 架全灭判负', path: '/planes' },
  { id: 'davinci', icon: '🔐', name: '达芬奇密码', desc: '猜牌推理 · 2-4 人 · 猜中连猜 · 暗牌清零出局', path: '/davinci' },
  { id: 'kittens', icon: '💥', name: '爆炸猫', desc: '抽到炸弹就爆 · 拆弹/否决/攻击 · 2-5 人 · 活到最后', path: '/kittens' },
  { id: 'reversi', icon: '⚫', name: '黑白棋', desc: '8×8 奥赛罗 · 夹住就翻子 · 2 人对弈 · 子多者胜', path: '/reversi' },
];
const GM = Object.fromEntries(GAMES.map(g => [g.id, g]));

const $ = id => document.getElementById(id);
document.getElementById('avatar').src = profile.avatar || avatarURI(profile.gid, profile.name);
document.getElementById('lobby-name').value = profile.name;
const saveName = () => {
  profile.name = $('lobby-name').value.slice(0, 16) || '玩家';
  localStorage.setItem('fxq_profile', JSON.stringify(profile));
};

// ---- Tab 切换（hash 记忆，默认大厅） ----
function showTab(name) {
  for (const t of document.querySelectorAll('.tab')) t.classList.toggle('active', t.dataset.tab === name);
  $('tab-lobby').hidden = name !== 'lobby';
  $('tab-games').hidden = name !== 'games';
  history.replaceState(null, '', '#' + name);
  if (name === 'lobby') refreshRooms();
}
document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab');
  if (t) showTab(t.dataset.tab);
});
showTab(location.hash === '#games' ? 'games' : 'lobby');

// ---- 大厅：房间列表（5s 轮询，仅大厅页可见时） ----
let roomsCache = [];
async function refreshRooms() {
  try {
    const j = await fetch('/api/lobby').then(r => r.json());
    roomsCache = j.rooms || [];
  } catch { roomsCache = []; }
  if ($('tab-lobby').hidden) return;
  renderRooms();
}
function renderRooms() {
  const el = $('rooms');
  if (!roomsCache.length) {
    el.innerHTML = `<div class="empty">暂时没有活跃房间<br>挑一个游戏，创建房间等朋友来吧
      <br><button class="btn" id="btn-goto-games">🎮 去游戏列表</button></div>`;
    $('btn-goto-games').onclick = () => showTab('games');
    return;
  }
  el.innerHTML = roomsCache.map(r => {
    const g = GM[r.game] || { icon: '🎮', name: r.game, path: '/' };
    const full = r.players >= r.max;
    const btn = r.started || full
      ? `<button class="btn ghost" data-code="${r.code}" data-game="${r.game}">${r.started ? '观战' : '已满'}</button>`
      : `<button class="btn" data-code="${r.code}" data-game="${r.game}">加入</button>`;
    return `<div class="room">
      <span class="gicon">${g.icon}</span>
      <div class="meta">
        <b>${g.name}</b> <span class="code">${r.code}</span>
        <div class="host">房主 ${esc(r.host || '—'}</div>
      </div>
      <span class="badge ${r.started ? 'play' : 'wait'}">${r.started ? '游戏中' : '等待中'}</span>
      <span class="cnt">${r.players}/${r.max}</span>
      ${btn}
    </div>`;
  }).join('');
}
$('rooms').addEventListener('click', e => {
  const b = e.target.closest('button[data-code]');
  if (!b) return;
  saveName();
  location.href = (GM[b.dataset.game] || {}).path + '?room=' + b.dataset.code;
});
setInterval(() => { if (!$('tab-lobby').hidden && !document.hidden) refreshRooms(); }, 5000);
refreshRooms();

// ---- 快速加入：优先等人的房间，随机挑一个 ----
$('btn-quick').onclick = async () => {
  saveName();
  const msg = $('msg');
  if (!roomsCache.length) await refreshRooms();
  const joinable = roomsCache.filter(r => !r.started && r.players < r.max);
  if (!joinable.length) {
    msg.textContent = '暂无可加入的房间 —— 去游戏列表创建一个吧';
    return;
  }
  const r = joinable[Math.floor(Math.random() * joinable.length)];
  location.href = GM[r.game].path + '?room=' + r.code;
};

// ---- 房间号加入 ----
$('btn-join').onclick = async () => {
  const code = $('join-code').value.trim().toLowerCase();
  const msg = $('msg');
  if (!/^[a-z0-9]{4}$/.test(code)) { msg.textContent = '房间号为 4 位字母数字'; return; }
  saveName();
  // 按首字母路由游戏类型
  const PG = { f: 'fxq', g: 'gobang', u: 'uno', p: 'planes', d: 'davinci', k: 'kittens', r: 'reversi' };
  const game = PG[code[0]] || 'fxq';
  const info = await fetch('/api/room-info?code=' + code).then(r => r.json()).catch(() => null);
  if (!info || info.error) { msg.textContent = '房间不存在或已过期'; return; }
  location.href = GM[info.game].path + '?room=' + code;
};

// ---- 游戏列表 tab ----
$('games').innerHTML = GAMES.map(g => `
  <div class="card">
    <div class="icon">${EMBLEM[g.id] || ""}</div>
    <h2>${g.name}</h2>
    <p>${g.desc}</p>
    <div class="row"><button class="btn" data-game="${g.id}" data-path="${g.path}">创建房间</button></div>
  </div>`).join('');
$('games').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-game]');
  if (!btn) return;
  saveName();
  const r = await fetch('/api/new-room?game=' + btn.dataset.game).then(r => r.json());
  location.href = btn.dataset.path + '?room=' + r.code;
});

// ---- 战绩面板 ----
const GAME_CN = { fxq: '✈️飞行棋', gobang: '⚫五子棋', uno: '🃏UNO', planes: '🛩️炸飞机', davinci: '🔐达芬奇密码', kittens: '💥爆炸猫', reversi: '⚪黑白棋' };
(async () => {
  try {
    const [mine, top] = await Promise.all([
      fetch('/api/stats?gid=' + profile.gid).then(r => r.json()).catch(() => ({})),
      fetch('/api/stats').then(r => r.json()).catch(() => ({})),
    ]);
    const el = $('stats');
    if (!mine.mine?.length && !top.top?.length) return;
    let html = '<h2 style="font-size:16px;margin-bottom:10px">🏆 战绩</h2>';
    if (mine.mine?.length) {
      html += '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">' +
        mine.mine.map(m => `<span style="background:var(--panel);border-radius:8px;padding:6px 10px;font-size:13px">${GAME_CN[m.game] || m.game} ${m.n}战${m.w}胜</span>`).join('') + '</div>';
    }
    if (top.top?.length) {
      const byGame = {};
      top.top.forEach(r => { (byGame[r.game] = byGame[r.game] || []).push(r); });
      html += '<div style="font-size:13px;color:var(--muted);margin-bottom:6px">各游戏榜首</div>';
      html += '<div style="display:flex;gap:8px;flex-wrap:wrap">' + Object.entries(byGame).map(([g, rows]) => {
        const t3 = rows.slice(0, 3).map((r, i) => `${['🥇','🥈','🥉'][i]} ${esc(r.name} ${r.w}胜`).join(' ');
        return `<span style="background:var(--panel);border-radius:8px;padding:6px 10px;font-size:13px">${GAME_CN[g] || g}：${t3}</span>`;
      }).join('') + '</div>';
    }
    el.innerHTML = html;
  } catch {}
})();
</script>
</body>
</html>
